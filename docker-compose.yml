services:
  web:
    image: qingxu-web:0.2.1-demo
    build:
      context: .
      args:
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:stable-alpine}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-18080}:8080"
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
